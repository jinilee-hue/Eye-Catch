<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Eye Catch</title>
<link rel="stylesheet" href="css/font.css?v=54832f73">
<link rel="stylesheet" href="css/font-ko.css?v=fa5b8de1">
<link rel="stylesheet" href="css/style.css?v=5dab3b3d">
</head>
<body>
<div id="backdrop" aria-hidden="true"></div>
<div id="stage" data-screen="title">
  <img class="bg" src="assets/img/bg.webp?v=63245d8c" alt="">

  <!-- behind the 3D scene (the tutor and every card are 3D: js/monster.js, js/card3d.js) -->
  <div class="layer back">
  </div>

  <canvas id="gl" aria-hidden="true"></canvas>

  <!-- in front of the tutor -->
  <div class="layer front">
    <img class="title-el logo" id="logo" src="assets/img/logo-game.webp?v=ed2fed1c" alt="Eye Catch">
    <img class="game-el game-logo" src="assets/img/logo-game.webp?v=ed2fed1c" alt="Eye Catch">
    <button class="title-el start" id="btnStart" aria-label="Start game"><img src="assets/img/start.webp?v=b1e191c3" alt=""><i class="shine"></i></button>

    <div class="game-el plate p1" id="plate1"><span class="pname">Player 1</span><span class="tally"><i class="mini-card"></i><b class="score" id="score1">0</b></span></div>
    <div class="game-el plate p2" id="plate2"><span class="pname">Player 2</span><span class="tally"><i class="mini-card"></i><b class="score" id="score2">0</b></span></div>

    <button class="game-el buzzer p1" id="buzz1" aria-label="Player 1 button" data-p="0"><span class="dome"><img src="assets/img/avatar1.webp?v=3d5c3953" alt=""></span><i class="ring"></i><i class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></i></button>
    <button class="game-el buzzer p2" id="buzz2" aria-label="Player 2 button" data-p="1"><span class="dome"><img src="assets/img/avatar2.webp?v=444c9ece" alt=""></span><i class="ring"></i><i class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></i></button>

    <div class="game-el wordpop" id="wordPop" aria-live="polite"></div>
    <button class="game-el skip-btn" id="btnSkip" aria-label="Skip"><svg viewBox="0 0 24 24"><g transform="translate(12 12.2) scale(1.12) translate(-12 -12)"><circle cx="15.4" cy="4.1" r="2.45"/><path d="M14.1 7.1 11.2 12"/><path d="M13.6 8.3 18.3 6.2"/><path d="M13.6 8.3 9.3 6.5"/><path d="M11.2 12 14.8 13.5 13 16.5"/><path d="M11.2 12 8 14.3 5 12.9"/><path d="M7.8 20.9h9.8"/></g></svg></button>
    <div class="fx" id="fx" aria-hidden="true"></div>

    <div class="sys sys-left">
      <button class="sys-btn key" id="btnKey" aria-label="발음 인식 서버 키" data-api="unknown"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.6"/><path d="M11.6 12H20.5M17.6 12v3.2M20.5 12v2.4"/></svg><i class="dot"></i></button>
    </div>
    <div class="sys">
      <button class="sys-btn lang" id="btnLang" aria-label="Language: English or Korean"><span class="knob"></span>
        <span class="flag on" data-l="en"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="flag-en"><circle cx="12" cy="12" r="12"/></clipPath></defs><g clip-path="url(#flag-en)"><rect width="24" height="24" fill="#fff"/><rect y="0" width="24" height="1.85" fill="#b22234"/><rect y="3.69" width="24" height="1.85" fill="#b22234"/><rect y="7.38" width="24" height="1.85" fill="#b22234"/><rect y="11.08" width="24" height="1.85" fill="#b22234"/><rect y="14.77" width="24" height="1.85" fill="#b22234"/><rect y="18.46" width="24" height="1.85" fill="#b22234"/><rect y="22.15" width="24" height="1.85" fill="#b22234"/><rect width="12" height="12.92" fill="#3c3b6e"/><g fill="#fff"><circle cx="1.6" cy="1.8" r=".7"/><circle cx="4.5" cy="1.8" r=".7"/><circle cx="7.4" cy="1.8" r=".7"/><circle cx="10.3" cy="1.8" r=".7"/><circle cx="3.05" cy="3.7" r=".7"/><circle cx="5.95" cy="3.7" r=".7"/><circle cx="8.85" cy="3.7" r=".7"/><circle cx="1.6" cy="5.6" r=".7"/><circle cx="4.5" cy="5.6" r=".7"/><circle cx="7.4" cy="5.6" r=".7"/><circle cx="10.3" cy="5.6" r=".7"/><circle cx="3.05" cy="7.5" r=".7"/><circle cx="5.95" cy="7.5" r=".7"/><circle cx="8.85" cy="7.5" r=".7"/><circle cx="1.6" cy="9.4" r=".7"/><circle cx="4.5" cy="9.4" r=".7"/><circle cx="7.4" cy="9.4" r=".7"/><circle cx="10.3" cy="9.4" r=".7"/><circle cx="3.05" cy="11.3" r=".7"/><circle cx="5.95" cy="11.3" r=".7"/><circle cx="8.85" cy="11.3" r=".7"/></g></g></svg></span>
        <span class="flag" data-l="ko"><svg viewBox="-12 -12 24 24" aria-hidden="true"><defs><clipPath id="flag-ko"><circle r="12"/></clipPath></defs><g clip-path="url(#flag-ko)"><rect x="-18" y="-12" width="36" height="24" fill="#fff"/><g transform="rotate(33.69)"><path d="M-6 0a6 6 0 0 1 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#cd2e3a"/><path d="M-6 0a6 6 0 0 0 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#0047a0"/></g><g fill="#151515"><g transform="rotate(33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="5.6"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g><g transform="rotate(33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="2.5"/><rect x="-.75" y=".3" width=".9" height="2.5"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="5.6"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="2.5"/><rect x="-.15" y=".3" width=".9" height="2.5"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g></g></g></svg></span>
      </button>
      <button class="sys-btn" id="btnSound" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      <button class="sys-btn" id="btnHome" aria-label="Exit"><svg viewBox="0 0 24 24"><path d="M13 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H13"/><path d="M10 12h10"/><path d="M16.5 8.5 20 12l-3.5 3.5"/></svg></button>
    </div>

    <div class="result" id="result" aria-live="polite">
      <div class="res-card">
        <div class="res-faces"><div class="res-p p1"><img src="assets/img/avatar1.webp?v=3d5c3953" alt=""><b id="res1">0</b></div><div class="res-p p2"><img src="assets/img/avatar2.webp?v=444c9ece" alt=""><b id="res2">0</b></div></div>
        <div class="res-title" id="resTitle"></div>
        <div class="res-btns">
          <button class="pill again" id="btnAgain"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.8 4.5v4.2h-4.2"/></svg><span>Play again</span></button>
          <button class="pill home" id="btnHome2"><svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></button>
        </div>
      </div>
    </div>
  </div>
  <div class="tap-guard" id="tapGuard"></div>
</div>

<script src="vendor/three.iife.js"></script>
<script src="js/sdf.js?v=74bda2ec"></script>
<script src="js/words.js?v=6290cb9c"></script>
<script src="js/cards-art.js?v=52841c94"></script>
<script src="js/art.js?v=cd04deac"></script>
<script src="js/voice.js?v=65ef3be0"></script>
<script src="js/voice-data.js?v=63b5a8db"></script>
<script src="js/bgm-data.js?v=df471ace" onerror="void 0"></script>
<script src="js/audio.js?v=53164419"></script>
<script src="js/mic.js?v=e9b449ed"></script>
<script src="js/phonics-api.js?v=724c1c25"></script>
<script src="js/stt.js?v=b3310c3d"></script>
<script src="js/monster.js?v=e768859f"></script>
<script src="js/card3d.js?v=aa5a7a57"></script>
<script src="js/logo-data.js?v=c83bb7e3"></script>
<script src="js/tin3d.js?v=a8834c2c"></script>
<script src="js/cards.js?v=50ea5955"></script>
<script src="js/fx.js?v=f8f22671"></script>
<script src="js/game.js?v=bb65dc1b"></script>
</body>
</html>
